<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#appGrad)"/>

  <!-- Pixel grid pattern (larger and more prominent) -->
  <g transform="translate(96, 96)">
    <rect x="0" y="0" width="100" height="100" fill="#fff" opacity="0.9" rx="10"/>
    <rect x="110" y="0" width="100" height="100" fill="#fff" opacity="0.7" rx="10"/>
    <rect x="220" y="0" width="100" height="100" fill="#fff" opacity="0.5" rx="10"/>

    <rect x="0" y="110" width="100" height="100" fill="#fff" opacity="0.7" rx="10"/>
    <rect x="110" y="110" width="100" height="100" fill="#22d3ee" opacity="1" rx="10"/>
    <rect x="220" y="110" width="100" height="100" fill="#fff" opacity="0.7" rx="10"/>

    <rect x="0" y="220" width="100" height="100" fill="#fff" opacity="0.5" rx="10"/>
    <rect x="110" y="220" width="100" height="100" fill="#fff" opacity="0.7" rx="10"/>
    <rect x="220" y="220" width="100" height="100" fill="#fff" opacity="0.9" rx="10"/>
  </g>
</svg>
