<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#grad)"/>

  <!-- Pixel grid pattern -->
  <rect x="8" y="8" width="5" height="5" fill="#fff" opacity="0.9"/>
  <rect x="14" y="8" width="5" height="5" fill="#fff" opacity="0.7"/>
  <rect x="20" y="8" width="5" height="5" fill="#fff" opacity="0.5"/>

  <rect x="8" y="14" width="5" height="5" fill="#fff" opacity="0.7"/>
  <rect x="14" y="14" width="5" height="5" fill="#22d3ee" opacity="1"/>
  <rect x="20" y="14" width="5" height="5" fill="#fff" opacity="0.7"/>

  <rect x="8" y="20" width="5" height="5" fill="#fff" opacity="0.5"/>
  <rect x="14" y="20" width="5" height="5" fill="#fff" opacity="0.7"/>
  <rect x="20" y="20" width="5" height="5" fill="#fff" opacity="0.9"/>
</svg>
